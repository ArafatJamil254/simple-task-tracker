<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskflow | Modern To-Do &amp; Task Manager</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-card">
    <header class="app-header">
      <div class="header-title">
        <h1>Today's Tasks</h1>
        <span class="date-badge" id="currentDateBadge">Today</span>
      </div>
      <p class="subtitle">Stay focused and productive.</p>

      <div class="progress-section">
        <div class="progress-info">
          <span id="progressText">0 of 0 completed</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </header>

    <form class="task-form" id="taskForm">
      <input type="text" id="taskInput" placeholder="Add a new task (e.g. review PRs, study CSS Grid)..." autocomplete="off" required>
      <button type="submit" class="add-btn" id="addBtn">+ Add</button>
    </form>

    <div class="filter-tabs">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
      <button class="clear-btn" id="clearCompletedBtn">Clear Completed</button>
    </div>

    <ul class="task-list" id="taskList">
      <!-- Dynamic task items -->
    </ul>

    <div class="empty-state" id="emptyState" style="display: none;">
      <span class="empty-icon">📝</span>
      <p>No tasks here yet. Add a new task above!</p>
    </div>

    <footer class="app-footer">
      <p>Tasks automatically persist in LocalStorage &bull; Double click to edit</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
